spring.application.name=helpdesk

# Fixed in-memory database name, so the H2 console URL is predictable
spring.datasource.url=jdbc:h2:mem:helpdesk
spring.h2.console.enabled=true

# Print the SQL Hibernate generates (useful while learning JPA)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
