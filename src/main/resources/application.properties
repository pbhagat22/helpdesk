spring.application.name=helpdesk

# Postgres from compose.yaml by default; override with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) when deploying elsewhere
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USERNAME:helpdesk}
spring.datasource.password=${DB_PASSWORD:helpdesk}

# Kafka from compose.yaml by default (KAFKA_BOOTSTRAP_SERVERS overrides it, e.g. inside Compose)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Events are sent as JSON (Jackson 3), keyed by ticket id as a string
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Don't add Java class names to message headers; consumers shouldn't depend on our class names
spring.kafka.producer.properties.spring.json.add.type.headers=false
# If Kafka is down, give up on a send after 3s instead of the default 60s, so a request
# that triggered an event isn't held up for a minute
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# Consumers: a new consumer group starts from the oldest message still in the topic
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON one: a message that isn't valid JSON (a "poison
# pill") is handed to the error handler instead of failing on every poll, forever
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Messages carry no type headers, so tell the deserializer what to build, and trust only our package
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.helpdesk.ticket.TicketEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.helpdesk.ticket

# Elasticsearch from compose.yaml by default (ELASTICSEARCH_URIS overrides it)
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s
# Search is a nice-to-have: if Elasticsearch is down, the app is still healthy and usable
# (only search fails). Without this, /actuator/health would report DOWN, and Docker or a
# load balancer would restart a perfectly working app.
management.health.elasticsearch.enabled=false

# LLM on Amazon Bedrock through the Converse API (AiProperties; defaults shown). AWS credentials come from the
# default chain: AWS_PROFILE locally, the ECS task role on AWS.
#helpdesk.ai.region=us-east-2
#helpdesk.ai.model=qwen.qwen3-32b-v1:0
#helpdesk.ai.agent-model=qwen.qwen3-235b-a22b-2507-v1:0
#helpdesk.ai.embedding-model=amazon.titan-embed-text-v2:0
#helpdesk.ai.timeout=60s

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks at
# startup that the tables match the entities, and fails fast if they don't
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the service layer's transactions; lazy loading
# from controllers (Open Session in View) would fail instead of running hidden queries
spring.jpa.open-in-view=false

# Print the SQL Hibernate generates (useful while learning JPA)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
