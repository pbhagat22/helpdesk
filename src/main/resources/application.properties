spring.application.name=helpdesk

# Postgres from compose.yaml by default; override with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) when deploying elsewhere
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USERNAME:helpdesk}
spring.datasource.password=${DB_PASSWORD:helpdesk}

# Kafka from compose.yaml by default (KAFKA_BOOTSTRAP_SERVERS overrides it, e.g. inside Compose)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Events are sent as JSON (Jackson 3), keyed by ticket id as a string
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Don't add Java class names to message headers; consumers shouldn't depend on our class names
spring.kafka.producer.properties.spring.json.add.type.headers=false
# If Kafka is down, give up on a send after 3s instead of the default 60s, so a request
# that triggered an event isn't held up for a minute
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# Consumers: a new consumer group starts from the oldest message still in the topic
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON one: a message that isn't valid JSON (a "poison
# pill") is handed to the error handler instead of failing on every poll, forever
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Messages carry no type headers, so tell the deserializer what to build, and trust only our package
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.helpdesk.ticket.TicketEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.helpdesk.ticket

# Elasticsearch from compose.yaml by default (ELASTICSEARCH_URIS overrides it)
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s
# Search is a nice-to-have: if Elasticsearch is down, the app is still healthy and usable
# (only search fails). Without this, /actuator/health would report DOWN, and Docker or a
# load balancer would restart a perfectly working app.
management.health.elasticsearch.enabled=false

# LLM on Amazon Bedrock through the Converse API (AiProperties; defaults shown). AWS credentials come from the
# default chain: AWS_PROFILE locally, the ECS task role on AWS.
#helpdesk.ai.region=us-east-2
#helpdesk.ai.model=qwen.qwen3-32b-v1:0
#helpdesk.ai.agent-model=qwen.qwen3-235b-a22b-2507-v1:0
#helpdesk.ai.embedding-model=amazon.titan-embed-text-v2:0
#helpdesk.ai.timeout=60s

# Bedrock on-demand prices in USD per million tokens (AiPricing), for the cost estimate in
# GET /api/admin/ai/usage. From the AWS Pricing API for us-east-2, checked 2026-10-22. The ":" in
# a model id must be escaped as "\:" in a .properties key.
helpdesk.ai.pricing.models[qwen.qwen3-32b-v1\:0].input-per-million=0.15
helpdesk.ai.pricing.models[qwen.qwen3-32b-v1\:0].output-per-million=0.60
helpdesk.ai.pricing.models[qwen.qwen3-235b-a22b-2507-v1\:0].input-per-million=0.22
helpdesk.ai.pricing.models[qwen.qwen3-235b-a22b-2507-v1\:0].output-per-million=0.88
helpdesk.ai.pricing.models[amazon.titan-embed-text-v2\:0].input-per-million=0.02
helpdesk.ai.pricing.models[amazon.titan-embed-text-v2\:0].output-per-million=0

# Daily AI limits per UTC day (AiBudgetProperties; defaults shown): tokens per user by role, and
# a cost cap for all AI features together. Over a limit, requests get 429 and triage is skipped.
#helpdesk.ai.budget.customer-daily-tokens=10000
#helpdesk.ai.budget.agent-daily-tokens=1000000
#helpdesk.ai.budget.admin-daily-tokens=1000000
#helpdesk.ai.budget.daily-cost-usd=1.00

# MCP server (mcp package): the agent's read-only tools for any MCP client (Claude Code, MCP
# Inspector, ...), at POST /api/mcp with the same bearer token as the rest of the API.
# Stateless: each request stands alone (no MCP session kept in memory), like our JWT auth, so
# it works behind a load balancer. The price: the server can't push notifications to clients.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/api/mcp
spring.ai.mcp.server.name=helpdesk
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Read-only access to a support helpdesk: tickets, users and help articles. \
  Tools run as the user whose token is sent, and see only what that user could see in the app.
# Our tools are registered as beans (McpServerConfig), not with @McpTool annotations, so skip
# the annotation scanner (it only logs warnings about finding nothing)
spring.ai.mcp.server.annotation-scanner.enabled=false
# We only offer tools, so don't advertise resources, prompts or completions
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
# Spring AI could re-offer the tools of the servers we connect to (below) on our own server.
# Off: our MCP server offers only our own tools (false is the default; stated here on purpose)
spring.ai.mcp.server.expose-mcp-client-tools=false

# MCP client (agent.ExternalMcpTools): our agent also uses tools from other MCP servers. Each
# connection is one server; Spring AI creates an McpSyncClient for it.
spring.ai.mcp.client.name=helpdesk
# Don't connect at startup: a server that's down would stop the app from starting. The client
# connects (MCP "initialize") on first use instead, and retries if that fails.
spring.ai.mcp.client.initialized=false
# Every question waits for these calls, so fail fast rather than after the 20s default
spring.ai.mcp.client.request-timeout=10s
# We call the clients ourselves, not through Spring AI's ChatClient tool callbacks or annotations
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.annotation-scanner.enabled=false
# AWS Knowledge: AWS's public documentation server (no credentials). It answers at the root path.
spring.ai.mcp.client.streamable-http.connections.aws-knowledge.url=https://knowledge-mcp.global.api.aws
spring.ai.mcp.client.streamable-http.connections.aws-knowledge.endpoint=/
# Only these external tools are offered to the model. A server can add tools (or change their
# descriptions, which the model reads) at any time, so new ones need a decision here first.
# read_documentation is left out on purpose: whole pages cost many tokens, and search results
# already contain page excerpts.
helpdesk.agent.mcp-tools=aws___search_documentation

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks at
# startup that the tables match the entities, and fails fast if they don't
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the service layer's transactions; lazy loading
# from controllers (Open Session in View) would fail instead of running hidden queries
spring.jpa.open-in-view=false

# Print the SQL Hibernate generates (useful while learning JPA)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
