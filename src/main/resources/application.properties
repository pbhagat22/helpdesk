spring.application.name=helpdesk

# Fixed in-memory database name, so the H2 console URL is predictable
spring.datasource.url=jdbc:h2:mem:helpdesk
spring.h2.console.enabled=true

# Keep database access inside the service layer's transactions; lazy loading
# from controllers (Open Session in View) would fail instead of running hidden queries
spring.jpa.open-in-view=false

# Print the SQL Hibernate generates (useful while learning JPA)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true
