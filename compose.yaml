# Local services.
#   docker compose up -d                       Postgres + Kafka (run the app with ./mvnw spring-boot:run)
#   docker compose --profile app up -d --build Postgres + the app as a container
#   docker compose --profile app down          stop everything (add -v to wipe the database)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      # Named volume: data survives `docker compose down` (use `down -v` to wipe it)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker and controller.
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Kafka tells clients which address to reconnect to ("advertised" listeners), so it
      # needs one per network: localhost:9092 for programs on your Mac (./mvnw spring-boot:run),
      # kafka:29092 for containers in this Compose network (the app service).
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # With a single broker, Kafka's internal topics can only have one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Keep messages in the named volume, so they survive `docker compose down`
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  app:
    # Only started with --profile app, so plain `docker compose up` stays Postgres-only
    profiles: ["app"]
    build: .
    image: helpdesk:latest
    environment:
      # Inside the Compose network, Postgres is reachable by its service name, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # First admin account, created at startup if missing. Local development only;
      # a real deployment gets these from a secret store, never from a committed file.
      HELPDESK_ADMIN_EMAIL: admin@example.com
      HELPDESK_ADMIN_PASSWORD: admin-password
      # Key that signs login tokens (at least 32 characters). Dev-only value; without it the
      # app makes a random key at startup and every restart logs everyone out.
      HELPDESK_JWT_SECRET: local-dev-only-jwt-secret-change-me-0123456789
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # "Healthy" once Spring Boot reports UP, so `up --wait` returns only when the API
    # answers. The JRE image has no curl, so bash's /dev/tcp sends a raw HTTP request.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

volumes:
  pgdata:
  kafkadata:
