# Single-node Kafka (KRaft, no ZooKeeper) for the local kind cluster: a Service and a StatefulSet.
#   kubectl apply -f k8s/kafka.yaml
#   kubectl exec -it -n helpdesk kafka-0 -- /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
---
# Other pods reach the broker as kafka:9092. Headless, like Postgres: the name resolves to the pod.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: helpdesk
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: helpdesk
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes normally adds variables like KAFKA_PORT=tcp://... for every Service in the
      # namespace. The Kafka image turns every KAFKA_* variable into a broker setting, so keep
      # those out.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # One client listener is enough here: every client (the app) is inside the cluster.
            # Kafka tells clients to reconnect to the advertised address, so it must be the
            # Service name, not the pod's IP (which changes when the pod is recreated).
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # With a single broker, Kafka's internal topics can only have one copy
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # The JVM heap must fit well inside the memory limit below: the JVM also needs
            # memory outside the heap (threads, class metadata, network buffers).
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx256m
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # A plain TCP check: "is something listening on 9092?". Compose ran Kafka's own
          # client script, but that starts a second JVM inside this container, which would
          # count against the memory limit every 10 seconds.
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
