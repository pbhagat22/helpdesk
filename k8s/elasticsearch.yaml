# Single-node Elasticsearch for the local kind cluster: a Service and a StatefulSet.
#   kubectl apply -f k8s/elasticsearch.yaml
#   kubectl exec -n helpdesk elasticsearch-0 -- curl -s localhost:9200/_cluster/health?pretty
---
# Other pods reach it as http://elasticsearch:9200
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: helpdesk
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: helpdesk
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # Elasticsearch normally needs the kernel setting vm.max_map_count >= 262144, which a
      # pod can't change on its own (production charts use a privileged init container).
      # Not needed here: OrbStack's kernel already has 262144, and single-node discovery
      # skips Elasticsearch's production startup checks.
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
          env:
            - name: discovery.type
              value: single-node
            # Local development only: no passwords or TLS. A real deployment keeps security on.
            - name: xpack.security.enabled
              value: "false"
            # Half of compose.yaml's heap, to fit the 8 GB Mac. Plenty for a few hundred tickets.
            - name: ES_JAVA_OPTS
              value: -Xms256m -Xmx256m
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          # An HTTP check made by the kubelet itself, so nothing extra runs in the container.
          # Any 2xx/3xx is "ready"; the health API answers 408 until the cluster is at least
          # yellow (yellow is normal on one node: replica shards have nowhere to go).
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=2s
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
