# Continuous integration: on every push and pull request, build and test everything.
# A red cross on a commit means something in it is broken; nothing gets deployed from here
# yet (deployment comes in roadmap stage 8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Reuses downloaded Maven dependencies between runs (keyed on pom.xml)
          cache: maven

      # verify = compile, run all tests, build the jar. Testcontainers starts Postgres
      # using the Docker that GitHub's Ubuntu runners have installed.
      - name: Build and test
        run: ./mvnw -B verify

      # When tests fail, keep their reports so you can download and read them.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image
    # Only worth building the image once the code itself is known to be good.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Buildx is Docker's builder with BuildKit (needed for the Dockerfile's cache mounts).
      - uses: docker/setup-buildx-action@v4

      # Proves the Dockerfile still builds. push: false, the image is thrown away; publishing
      # it to a registry is part of deployment (stage 8). The gha cache reuses unchanged
      # layers from earlier runs, so most builds only redo the application layer.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: helpdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
